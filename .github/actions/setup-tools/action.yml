name: Set up image tools
description: Install pinned, checksum-verified apko, melange, crane and trivy, plus uv, the dl tool, Go (for the launcher) and squashfs-tools (to unpack AppImages).
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: launcher/go.mod
        cache: false
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends squashfs-tools
    - shell: bash
      run: uv sync --locked
    - shell: bash
      env:
        APKO_VERSION: "1.4.13"
        APKO_SHA256: 2377cd4a2efed58905da580f835fbdf2a6ed4ad0f10ff541827153a42d491cee
        MELANGE_VERSION: "0.63.1"
        MELANGE_SHA256: 63b9fb5b81c16e588647392f75c17af77417b02d70cc82b667f9f0b7dd86662c
        CRANE_VERSION: "0.22.1"
        CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        TRIVY_VERSION: "0.76.1"
        TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
        fetch() {  # url sha256 member
          curl -fsSL "$1" -o pkg.tgz
          echo "$2  pkg.tgz" | sha256sum -c -
          tar -xzf pkg.tgz --wildcards --no-anchored "$3" -O > "$bin/$3"
          chmod +x "$bin/$3"
        }
        fetch "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz" "$APKO_SHA256" apko
        fetch "https://github.com/chainguard-dev/melange/releases/download/v${MELANGE_VERSION}/melange_${MELANGE_VERSION}_linux_amd64.tar.gz" "$MELANGE_SHA256" melange
        fetch "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" "$CRANE_SHA256" crane
        fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256" trivy
        echo "$bin" >> "$GITHUB_PATH"
