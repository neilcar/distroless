name: Sync pins

# Daily: resolve supported lines and newest released versions, re-lock every
# image (picking up dependency bumps), commit, and trigger the build.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Commit before the push that asked for this sync (build.yml sets it): if sync commits nothing, build the lines whose locks changed since"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: repo-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Resolve lines and render configs
        run: |
          set -euo pipefail
          uv run dl fetch-index --out "$RUNNER_TEMP/index"
          uv run dl sync --index-dir "$RUNNER_TEMP/index" --warnings "$RUNNER_TEMP/warnings.txt" \
            > "$RUNNER_TEMP/events.jsonl"
      - name: Lock (released versions only)
        run: .github/scripts/lock-all.sh
      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state locks
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          summary=$(git diff --cached --name-only | awk -F/ '$1=="locks"{print $2":"$3}' | sort -u | paste -sd, -)
          git commit -m "chore(sync): ${summary:-state}

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for attempt in 1 2 3; do
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            [[ $attempt == 3 ]] && exit 1
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger build
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME"
      # A catalog/package push that already carried the re-rendered locks leaves sync
      # nothing to commit, so the build above never runs. Build the lines the push changed
      # (and only those), in one dispatch: a second pending build run would replace the first.
      - name: Build pushed locks
        if: steps.commit.outputs.changed == 'false' && inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin "$SINCE"
          git diff --name-only "$SINCE" HEAD > "$RUNNER_TEMP/pushed.txt"
          lines=$(uv run dl changed-lines --changed "$RUNNER_TEMP/pushed.txt" | paste -sd' ' -)
          if [[ -z "$lines" ]]; then
            echo "No lock changed since $SINCE; nothing to build."
            exit 0
          fi
          echo "Locks already current; building what the push changed: $lines"
          gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f filter="$lines"
      - name: Report events, warnings and blocked lines
        run: |
          set -euo pipefail
          # Only main files issues; a branch run just logs what it would have filed.
          notify() {
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then uv run dl notify "$@"
            else echo "branch run, not notifying: $*"; fi
          }
          while IFS= read -r event; do
            kind=$(jq -r .kind <<<"$event"); detail=$(jq -r .detail <<<"$event")
            line=$(jq -r '.line.image + ":" + .line.name' <<<"$event")
            case "$kind" in
              line_added)          notify --title "New line: $line" --body "$detail ($RUN_URL)" ;;
              line_removed)        notify --title "Line retired: $line" --body "$detail. Its last images stay published. ($RUN_URL)" ;;
              nginx_minor_changed) notify --title "nginx line moved: $line" --body "$detail ($RUN_URL)" ;;
            esac
          done < "$RUNNER_TEMP/events.jsonl"
          if [[ -s "$RUNNER_TEMP/warnings.txt" ]]; then
            notify --title "Sync warning" --body "$(cat "$RUNNER_TEMP/warnings.txt") ($RUN_URL)"
          fi
          while IFS= read -r dir; do
            [[ -n "$dir" ]] || continue
            notify --title "Sync blocked: ${dir#locks/}" \
              --body "Could not produce a released-only lock; the line keeps its previous lock. ($RUN_URL)"
          done < "$RUNNER_TEMP/blocked.txt"
      - name: Check distroless-libvips against Wolfi libvips
        run: |
          set -euo pipefail
          # One deduped issue per Wolfi version; a branch run only prints what it would file.
          dry=(); [[ "$GITHUB_REF" == refs/heads/main ]] || dry=(--dry-run)
          uv run dl libvips-check --index-dir "$RUNNER_TEMP/index" "${dry[@]}"
      - name: Report failure
        if: failure() && github.ref == 'refs/heads/main'   # branch runs don't file issues
        run: uv run dl notify --title "Sync failed" --body "$RUN_URL"
