name: Build and publish

on:
  push:
    branches: [main]
    paths: ["locks/**", "catalog.yaml", "packages/**", ".trivyignore", "melange.rsa.pub"]
  workflow_dispatch:
    inputs:
      filter:
        description: "Only build these images or image:line names, space-separated (empty = everything)"
        required: false
        default: ""

permissions:
  contents: read

# One build at a time per branch, so an older run can't re-tag a floating tag after a
# newer one (only main pushes), and a branch run never displaces a queued main run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - id: matrix
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "push" && -n "$before" && ! "$before" =~ ^0+$ ]] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            git diff --name-only "$before" "${{ github.sha }}" > changed.txt
          else
            : > changed.txt   # dispatch, new branch or unknown base: build everything
          fi
          uv run dl matrix --changed changed.txt --filter "${FILTER:-}" > m.json
          if [[ $(jq -r .resync m.json) == true ]]; then
            # Configs/packages changed: sync re-renders and re-locks, then builds. If the
            # push already carried the right locks, sync commits nothing and instead builds
            # the lines whose locks changed since `before` (sync.yml, "Build pushed locks").
            echo "Config inputs changed; dispatching sync instead of building stale configs."
            gh workflow run sync.yml --ref "$GITHUB_REF_NAME" -f since="$before"
          fi
          echo "matrix=$(jq -c '{include}' m.json)" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.include | length > 0' m.json)" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.image):\(.line) \(.variant)"' m.json

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ matrix.image }}
      LINE: ${{ matrix.line }}
      VARIANT: ${{ matrix.variant }}
      REPO: ghcr.io/neilcar/distroless/${{ matrix.image }}
      CFG: locks/${{ matrix.image }}/${{ matrix.line }}/${{ matrix.variant }}.apko.yaml
      LOCK: locks/${{ matrix.image }}/${{ matrix.line }}/${{ matrix.variant }}.lock.json
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the revision annotation is the last commit touching this lock
      - uses: ./.github/actions/setup-tools
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The installer's default is cosign 3, whose signatures the cluster's Kyverno can't find; the image
          # repos pin the same version.
          cosign-release: v2.4.3

      - name: Tags
        run: |
          uv run dl tags --image "$IMAGE" --line "$LINE" --variant "$VARIANT" --lock "$LOCK" > tags.txt
          cat tags.txt
          echo "PRIMARY=$(head -1 tags.txt)" >> "$GITHUB_ENV"
          echo "HASHTAG=$(grep -E -- '-[0-9a-f]{8}(-[a-z]+)?$|^[0-9a-f]{8}$' tags.txt | head -1)" >> "$GITHUB_ENV"

      - name: Lock check (released-only; no shell or package manager in runtime images)
        run: |
          runtime=(); [[ "$VARIANT" == runtime ]] && runtime=(--runtime)
          uv run dl lock-check "${runtime[@]}" "$LOCK"

      # A line with vendor.json gets one more layer of pinned upstream files (and the
      # launcher that runs them). AppImage/binary prefixes are listed by the gate, not gated;
      # wheels are gated like any package (Trivy reads their site-packages metadata).
      - name: Vendored files
        run: |
          set -euo pipefail
          vendor="locks/$IMAGE/$LINE/vendor.json"
          [[ -f "$vendor" ]] || exit 0
          echo "VENDOR_JSON=$vendor" >> "$GITHUB_ENV"
      - name: Cache vendored downloads
        if: env.VENDOR_JSON != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vendor-cache
          key: vendor-${{ hashFiles(env.VENDOR_JSON) }}

      # photoprism-base (dev above all, with the MariaDB 13.1 client) outgrew the hosted
      # runner's free root disk while apko wrote both arches' layers to /tmp; so did
      # stash-base dev once it gained clang + lld (LLVM).
      - name: Free disk
        if: matrix.image == 'photoprism-base' || matrix.image == 'stash-base'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Build (both arches, plus a docker tarball for the smoke test)
        run: |
          set -euo pipefail
          mkdir -p oci sbom  # apko writes an OCI layout only into an existing directory
          # apko would stamp the current commit into the index, changing its digest on
          # every commit; use the commit that last changed this lock/config instead, so
          # an unchanged image keeps an identical digest. vendor.json sits in the same
          # lock dir, so a vendored version bump also moves the revision.
          rev=$(git log -1 --format=%H -- "$LOCK" "$CFG" ${VENDOR_JSON:+"$VENDOR_JSON"})
          apko build --vcs=false --annotations "org.opencontainers.image.revision:$rev" \
            --lockfile "$LOCK" --sbom-path sbom "$CFG" "$REPO:candidate" oci/
          ls sbom
          if [[ -n "${VENDOR_JSON:-}" ]]; then
            # Append before the views, the scan and the push: the scanned digest is the pushed one.
            # Only the runtime variant gets the launcher as /usr/bin/env; dev keeps busybox's.
            noenv=(); [[ "$VARIANT" == runtime ]] || noenv=(--no-env)
            for pair in x86_64:amd64 aarch64:arm64; do
              a=${pair%%:*}; p=${pair##*:}
              (cd launcher && CGO_ENABLED=0 GOOS=linux GOARCH="$p" \
                go build -trimpath -ldflags=-buildid= -o "$RUNNER_TEMP/launcher-$a" .)
              uv run dl vendor-layer --vendor "$VENDOR_JSON" --arch "$a" \
                --launcher "$RUNNER_TEMP/launcher-$a" --cache "$RUNNER_TEMP/vendor-cache" \
                --out "$RUNNER_TEMP/vendor-$a.tar.gz" --manifest "vendor-$a.json" "${noenv[@]}"
              uv run dl append-layer --layout oci/ --arch "$a" --layer "$RUNNER_TEMP/vendor-$a.tar.gz"
              rm "$RUNNER_TEMP/vendor-$a.tar.gz"   # the layout holds its own copy
            done
            cat vendor-*.json
          fi
          # Trivy ignores --platform for a multi-arch layout, so give each platform a
          # view of oci/ (the same blobs, hard-linked; the index lists only that manifest).
          for pair in x86_64:amd64 aarch64:arm64; do
            a=${pair%%:*}; p=${pair##*:}
            mkdir -p "view-$a" && cp -Rl oci/blobs oci/oci-layout "view-$a/"   # hard links: no second copy
            jq --arg p "$p" '.manifests |= map(select(.platform.architecture == $p))' \
              oci/index.json > "view-$a/index.json"
            [[ $(jq '.manifests | length' "view-$a/index.json") == 1 ]]
          done
          # The smoke test runs the amd64 image from oci/ itself, as a docker-load tarball:
          # its manifest.json points at that manifest's config and layer blobs.
          m=$(jq -r '.manifests[0].digest | ltrimstr("sha256:")' view-x86_64/index.json)
          jq --arg ref "$REPO:candidate-amd64" \
            '[{Config: ("blobs/sha256/" + (.config.digest | ltrimstr("sha256:"))), RepoTags: [$ref],
               Layers: [.layers[].digest | "blobs/sha256/" + ltrimstr("sha256:")]}]' \
            "oci/blobs/sha256/$m" > manifest.json
          mapfile -t blobs < <(jq -r '.[0].Config, .[0].Layers[]' manifest.json)
          tar -cf img-x86_64.tar manifest.json -C oci "${blobs[@]}"

      - name: Smoke test (amd64)
        run: |
          set -euo pipefail
          docker load -q < img-x86_64.tar
          tests/smoke/test_images.sh "$REPO:candidate-amd64" "$IMAGE" "$VARIANT"

      - name: Scan candidate and published image
        run: |
          set -euo pipefail
          # Scan each platform's view of oci/ and check the report really is for that
          # architecture.
          for pair in x86_64:amd64 aarch64:arm64; do
            a=${pair%%:*}; p=${pair##*:}
            trivy image --quiet --input "view-$a/" --format json --output "cand-$a.json"
            [[ $(jq -r .Metadata.ImageConfig.architecture "cand-$a.json") == "$p" ]] \
              || { echo "scanned the wrong architecture for $a"; exit 1; }
          done
          # Compare against the published image; only a definite "not found" means
          # this is the line's first publish. Any other registry error fails the job.
          # Signed in: GHCR answers an anonymous request for a never-published image
          # with DENIED, not NAME_UNKNOWN.
          crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          if out=$(crane digest "$REPO:$PRIMARY" 2>&1); then
            for pair in x86_64:amd64 aarch64:arm64; do
              a=${pair%%:*}; p=${pair##*:}
              trivy image --quiet --platform "linux/$p" --format json --output "pub-$a.json" "$REPO:$PRIMARY"
              [[ $(jq -r .Metadata.ImageConfig.architecture "pub-$a.json") == "$p" ]]
            done
          elif grep -qE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|404|not found' <<<"$out"; then
            echo "first publish of $REPO:$PRIMARY"
          else
            echo "$out"; echo "could not check the published image"; exit 1
          fi

      - name: Gate
        run: |
          set -uo pipefail
          uv run dl fetch-index --out "$RUNNER_TEMP/index" || exit 1
          rc=0
          for a in x86_64 aarch64; do
            pub=(); [[ -f "pub-$a.json" ]] && pub=(--published "pub-$a.json")
            vendored=(); [[ -n "${VENDOR_JSON:-}" ]] && vendored=(--vendor "$VENDOR_JSON")
            uv run dl gate --index-dir "$RUNNER_TEMP/index" --candidate "cand-$a.json" "${pub[@]}" "${vendored[@]}" \
              --ignore .trivyignore --label "$IMAGE:$LINE $VARIANT ($a)" > "gate-$a.md" || rc=1
            tee -a "$GITHUB_STEP_SUMMARY" < "gate-$a.md"   # also in the log, which the API can read
          done
          exit $rc

      - name: Push the scanned image
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git diff --quiet "${{ github.sha }}" origin/main -- "$LOCK" "$CFG" ${VENDOR_JSON:+"$VENDOR_JSON"}; then
            echo "A newer lock for this line is on main; its build will publish instead."
            echo "SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          digest=$(crane push --index oci/ "$REPO:$HASHTAG")
          digest=${digest##*@}
          # The pushed index must list exactly the per-platform manifests that were scanned.
          jq -r '.manifests[].digest' oci/index.json | sort > local.txt
          crane manifest "$REPO@$digest" | jq -r '.manifests[].digest' | sort > pushed.txt
          diff local.txt pushed.txt
          while read -r t; do crane tag "$REPO@$digest" "$t"; done < tags.txt
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Published \`$REPO@$digest\` as: $(paste -sd' ' tags.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign and attest
        if: github.ref == 'refs/heads/main' && env.SKIPPED != '1'
        run: |
          set -euo pipefail
          cosign sign --yes --recursive --registry-referrers-mode=legacy "$REPO@$DIGEST"   # the index and each per-arch image
          # Fail the build unless the signature verifies as Kyverno checks it: build.yml on main only.
          for ref in "$REPO@$DIGEST" $(jq -r --arg r "$REPO" '"\($r)@\(.manifests[].digest)"' oci/index.json); do
            cosign verify \
              --certificate-identity='https://github.com/neilcar/distroless/.github/workflows/build.yml@refs/heads/main' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              "$ref" > /dev/null
          done
          cosign attest --yes --type spdxjson --predicate sbom/sbom-index.spdx.json "$REPO@$DIGEST"
          for pair in x86_64:amd64 aarch64:arm64; do
            a=${pair%%:*}; p=${pair##*:}
            d=$(jq -r --arg p "$p" '.manifests[] | select(.platform.architecture == $p) | .digest' oci/index.json)
            cosign attest --yes --type spdxjson --predicate "sbom/sbom-$a.spdx.json" "$REPO@$d"
            # The vendored layer is not in apko's SBOM; attest what went into it.
            if [[ -f "vendor-$a.json" ]]; then
              cosign attest --yes --type https://github.com/neilcar/distroless/vendor-layer/v1 \
                --predicate "vendor-$a.json" "$REPO@$d"
            fi
          done

      - name: Report failure
        if: failure() && github.ref == 'refs/heads/main'   # branch runs don't file issues
        run: |
          uv run dl notify --title "Build failed: $IMAGE:$LINE-$VARIANT" --body "$RUN_URL"
