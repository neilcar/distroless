contents:
  repositories:
  - https://packages.wolfi.dev/os
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - bash=5.3-r14
  - coreutils
  - findutils
  - grep
  - sed
  - gawk
  - procps
  - less
  - file
  - gnutar
  - gzip
  - util-linux-misc
  - nsenter
  - curl
  - openssl
  - jq
  - yq
  - sqlite
  - bind-tools
  - netcat-openbsd
  - iproute2
  - tcpdump
  - strace
  - lsof
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  run-as: '0'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: debug:latest-tools
entrypoint:
  command: /bin/bash
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
