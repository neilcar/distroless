contents:
  repositories:
  - https://packages.wolfi.dev/os
  - ./packages
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - ./melange.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - python-3.12=3.12.16-r3
  - ffmpeg
  - nodejs-26
  - ca-certificates-bundle
  - tzdata
  - busybox
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: mv
    gid: 1000
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: mv
    uid: 1000
    gid: 1000
    homedir: /tmp
  run-as: '1000'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: music-videos-base:latest-dev
entrypoint:
  command: /usr/bin/python3.12
environment:
  PYTHONUNBUFFERED: '1'
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
