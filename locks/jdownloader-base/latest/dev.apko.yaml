contents:
  repositories:
  - https://packages.wolfi.dev/os
  - ./packages
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - ./melange.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - openjdk-21-jre=21.0.13.0.3-r1
  - tini
  - ffmpeg
  - libstdc++
  - libgcc
  - ca-certificates-bundle
  - tzdata
  - busybox
  - bash
  - curl
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: jdownloader
    gid: 1000
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: jdownloader
    uid: 1000
    gid: 1000
    homedir: /config
  run-as: '1000'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: jdownloader-base:latest-dev
environment:
  HOME: /config
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /config
  type: directory
  permissions: 493
  uid: 1000
  gid: 1000
- path: /usr/bin/java
  type: symlink
  source: /usr/lib/jvm/java-21-openjdk/bin/java
  permissions: 493
