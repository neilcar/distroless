contents:
  repositories:
  - https://packages.wolfi.dev/os
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - rust-1.100=1.100.0-r0
  - busybox
  - gcc
  - glibc-dev
  - clang-23
  - lld-23
  - git
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  run-as: '0'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: rust:latest-dev
entrypoint:
  command: /bin/sh
environment:
  CARGO_HOME: /usr/local/cargo
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /usr/local/cargo
  type: directory
  permissions: 493
  uid: 0
  gid: 0
