contents:
  repositories:
  - https://packages.wolfi.dev/os
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - tesseract=5.5.2-r8
  - tesseract-eng
  - python-3.12=3.12.16-r3
  - python-3.12-base=3.12.16-r3
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  run-as: '65532'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: tesseract:latest
entrypoint:
  command: /usr/bin/python3.12
environment:
  PYTHONUNBUFFERED: '1'
  OMP_THREAD_LIMIT: '1'
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
