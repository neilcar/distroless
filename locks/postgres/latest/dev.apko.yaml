contents:
  repositories:
  - https://packages.wolfi.dev/os
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - postgresql-17=17.10-r1
  - postgresql-17-client
  - glibc-locale-en
  - tzdata
  - busybox
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: postgres
    gid: 70
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: postgres
    uid: 70
    gid: 70
    homedir: /var/lib/postgresql
  run-as: '70'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: postgres:latest-dev
entrypoint:
  command: /usr/bin/postgres
environment:
  LANG: en_US.UTF-8
  PGDATA: /var/lib/postgresql/data/pgdata
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /var/lib/postgresql
  type: directory
  permissions: 493
  uid: 70
  gid: 70
- path: /var/lib/postgresql/data
  type: directory
  permissions: 448
  uid: 70
  gid: 70
- path: /var/run/postgresql
  type: directory
  permissions: 1533
  uid: 70
  gid: 70
