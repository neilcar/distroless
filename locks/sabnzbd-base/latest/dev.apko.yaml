contents:
  repositories:
  - https://packages.wolfi.dev/os
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - python-3.14=3.14.7-r8
  - 7zip
  - libstdc++
  - libgcc
  - libgomp
  - busybox
  - bash
  - gcc
  - make
  - glibc-dev
  - py3.14-pip
  - uv
  - xz
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: sabnzbd
    gid: 1000
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: sabnzbd
    uid: 1000
    gid: 1000
    homedir: /config
  run-as: '1000'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: sabnzbd-base:latest-dev
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /config
  type: directory
  permissions: 493
  uid: 1000
  gid: 1000
- path: /usr/lib/python3.14/encodings/rot_13.py
  type: permissions
  permissions: 420
