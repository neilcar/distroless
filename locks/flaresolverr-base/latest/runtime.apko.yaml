contents:
  repositories:
  - https://packages.wolfi.dev/os
  - ./packages
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - ./melange.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - chromium=149.0.7827.53-r0
  - distroless-no-shell
  - python-3.11
  - Xvfb
  - dumb-init
  - ttf-dejavu
  - ca-certificates-bundle
  - tzdata
  - minizip=1.3.2-r7
  - python-3.13-base=3.13.15-r8
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: flaresolverr
    gid: 1000
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: flaresolverr
    uid: 1000
    gid: 1000
    homedir: /config
  run-as: '1000'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: flaresolverr-base:latest
environment:
  HOME: /config
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /config
  type: directory
  permissions: 493
  uid: 1000
  gid: 1000
- path: /usr/local/bin
  type: directory
  permissions: 493
  uid: 0
  gid: 0
- path: /usr/local/bin/python
  type: symlink
  source: /usr/bin/python3.11
  permissions: 493
