contents:
  repositories:
  - https://packages.wolfi.dev/os
  - ./packages
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - ./melange.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - python-3.12=3.12.16-r1
  - ffmpeg
  - distroless-libvips
  - py3.12-pip
  - py3.12-requests
  - py3.12-requests-toolbelt
  - py3.12-lxml
  - py3.12-beautifulsoup4
  - py3.12-pyparsing
  - py3.12-tzlocal
  - py3.12-regex
  - py3.12-python-dateutil
  - py3.12-pytz
  - exiftool
  - perl
  - busybox
  - bash
  - coreutils
  - git
  - make
  - gcc
  - glibc-dev
  - go-1.27
  - nodejs-24
  - npm
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: stash
    gid: 1000
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: stash
    uid: 1000
    gid: 1000
    homedir: /config
  run-as: '1000'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: stash-base:latest-dev
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /config
  type: directory
  permissions: 493
  uid: 1000
  gid: 1000
- path: /usr/local/bin
  type: directory
  permissions: 493
  uid: 0
  gid: 0
- path: /usr/local/bin/python
  type: symlink
  source: /usr/bin/python3.12
  permissions: 493
