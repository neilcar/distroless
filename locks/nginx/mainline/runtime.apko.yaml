contents:
  repositories:
  - https://packages.wolfi.dev/os
  - ./packages
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - ./melange.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - nginx-mainline=1.31.8-r1
  - nginx-mainline-mime-types
  - distroless-nginx-config
  - zlib=1.3.2-r7
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  run-as: '65532'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: nginx:mainline
entrypoint:
  command: /usr/sbin/nginx
cmd: -g 'daemon off;'
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /var/lib/nginx
  type: directory
  permissions: 493
  uid: 65532
  gid: 65532
- path: /var/lib/nginx/logs
  type: directory
  permissions: 493
  uid: 65532
  gid: 65532
- path: /var/lib/nginx/tmp
  type: directory
  permissions: 493
  uid: 65532
  gid: 65532
