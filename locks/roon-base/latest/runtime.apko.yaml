contents:
  repositories:
  - https://packages.wolfi.dev/os
  - ./packages
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - ./melange.rsa.pub
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - tzdata
  - libicu79=79.1-r2
  - libssl3
  - libcrypto3
  - zlib
  - sqlite-libs
  - libstdc++
  - libgcc
  - ca-certificates-bundle
  - tzdata
  - alsa-lib
  - freetype
  - distroless-openssl-legacy
accounts:
  groups:
  - groupname: nonroot
    gid: 65532
  - groupname: roon
    gid: 1000
  users:
  - username: nonroot
    uid: 65532
    gid: 65532
  - username: roon
    uid: 1000
    gid: 1000
    homedir: /var/roon
  run-as: '1000'
archs:
- x86_64
- aarch64
annotations:
  org.opencontainers.image.source: https://github.com/neilcar/distroless
  org.opencontainers.image.title: roon-base:latest
environment:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 'false'
  OPENSSL_MODULES: /usr/lib/ossl-modules-legacy
paths:
- path: /tmp
  type: directory
  permissions: 1023
  uid: 0
  gid: 0
- path: /var/roon
  type: directory
  permissions: 493
  uid: 1000
  gid: 1000
- path: /run
  type: directory
  permissions: 493
  uid: 1000
  gid: 1000
