[project]
name = "dltools"
version = "0.1.0"
description = "Tooling that pins, renders, gates and tracks the neilcar/distroless images"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
dl = "dltools.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dltools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
