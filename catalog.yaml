# Image definitions rendered into locks/<image>/<line>/<variant>.apko.yaml by `dl sync`.
# `{line}` is the line name (python: "3.12"); the headline package is pinned automatically.
repositories: [https://packages.wolfi.dev/os]
keyring: [https://packages.wolfi.dev/os/wolfi-signing.rsa.pub]
archs: [x86_64, aarch64]
accounts:
  groups: [{groupname: nonroot, gid: 65532}]
  users: [{username: nonroot, uid: 65532, gid: 65532}]
  run-as: "65532"
base_packages: [wolfi-baselayout, ca-certificates-bundle, tzdata]

images:
  static:
    variants:
      runtime:
        packages: []

  python:
    variants:
      runtime:
        packages: ["python-{line}"]
        entrypoint: "/usr/bin/python{line}"
      dev:
        packages: ["python-{line}", "busybox", "py{line}-pip", "uv"]
        entrypoint: "/usr/bin/python{line}"
    environment:
      PYTHONUNBUFFERED: "1"

  nginx:
    # Lines to build. `stable` was dropped: public Wolfi's nginx-stable stopped at
    # 1.30.2 with unfixed CVEs (fixed builds were never published), and nothing uses it.
    lines: [mainline]
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      runtime:
        packages: ["{package}", "{package}-mime-types", "distroless-nginx-config"]
        entrypoint: "/usr/sbin/nginx"
        cmd: "-g 'daemon off;'"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      # nginx opens its compiled-in error log before reading nginx.conf.
      - {path: /var/lib/nginx, type: directory, permissions: 0755, uid: 65532, gid: 65532}
      - {path: /var/lib/nginx/logs, type: directory, permissions: 0755, uid: 65532, gid: 65532}
      - {path: /var/lib/nginx/tmp, type: directory, permissions: 0755, uid: 65532, gid: 65532}

  photoprism-base:
    # PhotoPrism's runtime tools; runs as root (owner's decision), unlike every other image.
    run_as: "0"
    lines: [latest]
    variants:
      runtime:
        packages: ["{package}", "ffmpeg", "exiftool", "perl", "libheif", "imagemagick-7", "libjxl-tools", "ghostscript", "librsvg", "rsvg-convert", "mariadb-11.8-client", "sqlite", "x265", "dav1d", "aom", "libde265", "libva", "glibc-locale-posix", "libstdc++", "fontconfig", "ttf-dejavu"]
      dev:
        packages: ["{package}", "ffmpeg", "exiftool", "perl", "libheif", "imagemagick-7", "libjxl-tools", "ghostscript", "librsvg", "rsvg-convert", "mariadb-11.8-client", "sqlite", "x265", "dav1d", "aom", "libde265", "libva", "glibc-locale-posix", "libstdc++", "fontconfig", "ttf-dejavu", "busybox", "bash", "curl", "git", "make", "go-1.27", "nodejs-22", "npm", "gcc", "glibc-dev", "libvips-dev", "libheif-dev", "pkgconf"]
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
    # Upstream files with no Wolfi package, pinned by sha256 (see locks/<image>/<line>/vendor.json).
    vendor:
      - name: darktable
        version: 5.6.2
        kind: appimage
        prefix: /opt/darktable
        files:
          x86_64:
            url: https://github.com/darktable-org/darktable/releases/download/release-5.6.2/Darktable-5.6.2-x86_64.AppImage
            sha256: 4b0d1c737a2a18c7d8afb81aa3daaf25930bbe541dda98e6354dabd5c2e4dc36
          aarch64:
            url: https://github.com/darktable-org/darktable/releases/download/release-5.6.2/Darktable-5.6.2-aarch64.AppImage
            sha256: 5b8015f8534453cb3bbd6e5a03e362cb7d9d9573f20d3928aadad354df18ad10
        launchers: [darktable-cli]
      - name: rawtherapee
        version: "5.13"
        kind: appimage
        prefix: /opt/rawtherapee
        files:
          x86_64:
            url: https://github.com/RawTherapee/RawTherapee/releases/download/5.13/RawTherapee_5.13_x86_64_release.AppImage
            sha256: 746a3509a234804c3a5f66649006ac29ac67f193a8559d2297357949a890b097
          aarch64:
            url: https://github.com/RawTherapee/RawTherapee/releases/download/5.13/RawTherapee_5.13_arm64_release.AppImage
            sha256: 9e424633272a49bb47afe4bf065604858acf9de77c4d80e0f6557024492e2b55
        launchers: [rawtherapee-cli]
      - name: yt-dlp
        version: 2026.10.21
        kind: binary
        prefix: /opt/yt-dlp
        files:
          x86_64:
            url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux
            sha256: d8bd33fca9d5b23bd5b9952b3fca36db5c46331933fda9f598a3da14ce2c243f
          aarch64:
            url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux_aarch64
            sha256: e137c2171b0b8ef648e6136e86aa70c65923e93e434f01c93901d64744b190aa
        launchers: [yt-dlp]
