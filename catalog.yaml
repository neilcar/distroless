# Image definitions rendered into locks/<image>/<line>/<variant>.apko.yaml by `dl sync`.
# `{line}` is the line name (python: "3.12"); the headline package is pinned automatically.
repositories: [https://packages.wolfi.dev/os]
keyring: [https://packages.wolfi.dev/os/wolfi-signing.rsa.pub]
archs: [x86_64, aarch64]
accounts:
  groups: [{groupname: nonroot, gid: 65532}]
  users: [{username: nonroot, uid: 65532, gid: 65532}]
  run-as: "65532"
base_packages: [wolfi-baselayout, ca-certificates-bundle, tzdata]

images:
  static:
    variants:
      runtime:
        packages: []

  python:
    variants:
      runtime:
        packages: ["python-{line}"]
        entrypoint: "/usr/bin/python{line}"
      dev:
        packages: ["python-{line}", "busybox", "py{line}-pip", "uv"]
        entrypoint: "/usr/bin/python{line}"
    environment:
      PYTHONUNBUFFERED: "1"

  nginx:
    # Lines to build. `stable` was dropped: public Wolfi's nginx-stable stopped at
    # 1.30.2 with unfixed CVEs (fixed builds were never published), and nothing uses it.
    lines: [mainline]
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      runtime:
        packages: ["{package}", "{package}-mime-types", "distroless-nginx-config"]
        entrypoint: "/usr/sbin/nginx"
        cmd: "-g 'daemon off;'"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      # nginx opens its compiled-in error log before reading nginx.conf.
      - {path: /var/lib/nginx, type: directory, permissions: 0755, uid: 65532, gid: 65532}
      - {path: /var/lib/nginx/logs, type: directory, permissions: 0755, uid: 65532, gid: 65532}
      - {path: /var/lib/nginx/tmp, type: directory, permissions: 0755, uid: 65532, gid: 65532}

  photoprism-base:
    # PhotoPrism's runtime tools; runs as root (owner's decision), unlike every other image.
    # `{package}` is distroless-libvips (melange/, built with lcms2 for icc_transform; Wolfi's
    # libvips has no lcms2), versioned from its melange config; it provides libvips/libvips-dev.
    run_as: "0"
    lines: [latest]
    # ghostscript is deliberately left out: it pulls gtk-3 -> cups-libs -> avahi-libs, which has
    # no released version in Wolfi (only 0.9_rc5), so the line could not be locked release-only.
    # PhotoPrism never calls gs and the library has no PS/EPS/AI/PDF files.
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      # mariadb-13.1-dump: mariadb-dump, for PhotoPrism's scheduled database backup.
      # mariadb-13.1-client: Wolfi stopped updating the 11.8 line at 11.8.3-r0, which has
      # unfixed Criticals (#34); 13.1 is the line Wolfi maintains, and talks to the 13.0 server.
      # libx11 .. libuuid: host libraries darktable's AppImage expects from the system
      # (linuxdeploy's excludelist), found as the NEEDED closure of darktable-cli and its plugins.
      runtime:
        # distroless-no-shell provides cmd:bash so ffmpeg's libsrt (which needs bash only
        # for its unused srt-* scripts) installs without a shell. Runtime only; dev keeps bash.
        packages: ["{package}", "distroless-no-shell", "ffmpeg", "exiftool", "perl", "libheif", "imagemagick-7", "libjxl-tools", "librsvg", "rsvg-convert", "mariadb-13.1-client", "mariadb-13.1-dump", "sqlite", "x265", "dav1d", "aom", "libde265", "libva", "glibc-locale-posix", "libstdc++", "fontconfig", "ttf-dejavu", "libx11", "libxcb", "wayland-libs-client", "harfbuzz", "libfontconfig1", "freetype", "fribidi", "alsa-lib", "libdrm-libs", "mesa-gbm", "libglvnd", "gmp", "libgpg-error", "libcom_err", "libusb", "libuuid"]
      # dev: gnutar, rsync, wget and coreutils for PhotoPrism's `make install`; Node >= 24.15
      # for its frontend build; clang-23 + lld-23 cross-compile the cgo binary for arm64 on amd64
      # runners (Wolfi gcc only targets its own arch; the target glibc and libraries come from
      # the arm64 dev image as a sysroot), as for stash-base.
      dev:
        packages: ["{package}", "ffmpeg", "exiftool", "perl", "libheif", "imagemagick-7", "libjxl-tools", "librsvg", "rsvg-convert", "mariadb-13.1-client", "mariadb-13.1-dump", "sqlite", "x265", "dav1d", "aom", "libde265", "libva", "glibc-locale-posix", "libstdc++", "fontconfig", "ttf-dejavu", "libx11", "libxcb", "wayland-libs-client", "harfbuzz", "libfontconfig1", "freetype", "fribidi", "alsa-lib", "libdrm-libs", "mesa-gbm", "libglvnd", "gmp", "libgpg-error", "libcom_err", "libusb", "libuuid", "busybox", "bash", "curl", "git", "make", "go-1.27", "nodejs-24", "npm", "gcc", "glibc-dev", "{package}-dev", "libheif-dev", "pkgconf", "gnutar", "rsync", "wget", "coreutils", "clang-23", "lld-23"]
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
    # Upstream files with no Wolfi package, pinned by sha256 (see locks/<image>/<line>/vendor.json).
    vendor:
      - name: darktable
        version: 5.6.2
        kind: appimage
        prefix: /opt/darktable
        files:
          x86_64:
            url: https://github.com/darktable-org/darktable/releases/download/release-5.6.2/Darktable-5.6.2-x86_64.AppImage
            sha256: 4b0d1c737a2a18c7d8afb81aa3daaf25930bbe541dda98e6354dabd5c2e4dc36
          aarch64:
            url: https://github.com/darktable-org/darktable/releases/download/release-5.6.2/Darktable-5.6.2-aarch64.AppImage
            sha256: 5b8015f8534453cb3bbd6e5a03e362cb7d9d9573f20d3928aadad354df18ad10
        launchers: [darktable-cli]
      - name: rawtherapee
        version: "5.13"
        kind: appimage
        prefix: /opt/rawtherapee
        files:
          x86_64:
            url: https://github.com/RawTherapee/RawTherapee/releases/download/5.13/RawTherapee_5.13_x86_64_release.AppImage
            sha256: 746a3509a234804c3a5f66649006ac29ac67f193a8559d2297357949a890b097
          aarch64:
            url: https://github.com/RawTherapee/RawTherapee/releases/download/5.13/RawTherapee_5.13_arm64_release.AppImage
            sha256: 9e424633272a49bb47afe4bf065604858acf9de77c4d80e0f6557024492e2b55
        launchers: [rawtherapee-cli]
      - name: yt-dlp
        version: 2026.10.21
        kind: binary
        prefix: /opt/yt-dlp
        files:
          x86_64:
            url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux
            sha256: d8bd33fca9d5b23bd5b9952b3fca36db5c46331933fda9f598a3da14ce2c243f
          aarch64:
            url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux_aarch64
            sha256: e137c2171b0b8ef648e6136e86aa70c65923e93e434f01c93901d64744b190aa
        launchers: [yt-dlp]

  stash-base:
    # Base for the shell-free Stash build (neilcar/stash-image): Wolfi ffmpeg, distroless-libvips
    # (lcms2, as photoprism-base), and Python 3.12 with the libraries the enabled plugins and the
    # Python scrapers import (audit: .superpowers/sdd/2026-10-25-stash-distroless/task-2-report.md).
    # Versioned by python-3.12. Runs as uid/gid 1000 (`stash`, home /config), like the chart's pod.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: stash, gid: 1000}]
      users: [{username: stash, uid: 1000, gid: 1000, homedir: /config}]
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      # py3.12-tzlocal .. -pytz: dependencies of the dateparser and apscheduler wheels
      # (date_parser, stash-scheduler); py3.12-pyparsing: cloudscraper's.
      # exiftool + perl: the EmbeddedMetadata scraper (PyExifTool runs `exiftool`, a
      # `#!/usr/bin/env perl` script; its pyexiv2 is pip-installed at runtime by the scraper).
      runtime:
        # distroless-no-shell: ffmpeg's libsrt needs cmd:bash only for unused scripts.
        packages: ["{package}", "distroless-no-shell", "ffmpeg", "distroless-libvips", "py3.12-pip", "py3.12-requests", "py3.12-requests-toolbelt", "py3.12-lxml", "py3.12-beautifulsoup4", "py3.12-pyparsing", "py3.12-tzlocal", "py3.12-regex", "py3.12-python-dateutil", "py3.12-pytz", "exiftool", "perl"]
      # dev: Go (Stash's go.mod wants >= 1.24.3), Node.js 24 and npm for the UI build;
      # clang-23 + lld-23 cross-compile the cgo backend for arm64 on amd64 runners (Wolfi gcc
      # only targets its own arch; the target glibc comes from the arm64 dev image as a sysroot).
      dev:
        packages: ["{package}", "ffmpeg", "distroless-libvips", "py3.12-pip", "py3.12-requests", "py3.12-requests-toolbelt", "py3.12-lxml", "py3.12-beautifulsoup4", "py3.12-pyparsing", "py3.12-tzlocal", "py3.12-regex", "py3.12-python-dateutil", "py3.12-pytz", "exiftool", "perl", "busybox", "bash", "coreutils", "git", "make", "gcc", "glibc-dev", "clang-23", "lld-23", "go-1.27", "nodejs-24", "npm"]
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /config, type: directory, permissions: 0755, uid: 1000, gid: 1000}
      # No /usr/bin/python symlink here: Wolfi's python-3.12 already ships python -> python3
      # (plugins run both); apko refuses a path that a package installs.
      # CPython 3.12 ships its stdlib cgi.py executable with `#! /usr/local/bin/python`; give
      # that shebang a target so the shebang audit holds (cgi is only ever imported).
      # apko chmods through the link, so `permissions` must stay python3.12's own 0755.
      - {path: /usr/local/bin, type: directory, permissions: 0755, uid: 0, gid: 0}
      - {path: /usr/local/bin/python, type: symlink, source: /usr/bin/python3.12, permissions: 0755}
    # Pure-Python wheels not in Wolfi, pinned by sha256 (see locks/stash-base/latest/vendor.json).
    vendor:
      - name: cloudscraper
        version: 1.2.71
        kind: wheel
        prefix: /usr/lib/python3.12/site-packages
        files:
          any:
            url: https://files.pythonhosted.org/packages/81/97/fc88803a451029688dffd7eb446dc1b529657577aec13aceff1cc9628c5d/cloudscraper-1.2.71-py2.py3-none-any.whl
            sha256: 76f50ca529ed2279e220837befdec892626f9511708e200d48d5bb76ded679b0
      - name: mechanicalsoup
        version: 1.4.0
        kind: wheel
        prefix: /usr/lib/python3.12/site-packages
        files:
          any:
            url: https://files.pythonhosted.org/packages/4e/61/969eee3b34e39aa7810608e3d1932b555fa535cffa743cba6498b054453c/mechanicalsoup-1.4.0-py3-none-any.whl
            sha256: f460febdffabe24cc36b96dec420def2b30297c6d4663ab33c74e5b67787592d
      # PyPI stashapp-tools, imported as `stashapi`.
      - name: stashapi
        version: 0.2.59
        kind: wheel
        prefix: /usr/lib/python3.12/site-packages
        files:
          any:
            url: https://files.pythonhosted.org/packages/64/4d/7262a8dd1f96c012c4b3271453d4c3cbde7caa6b291d18b00553fc6ad64a/stashapp_tools-0.2.59-py3-none-any.whl
            sha256: ebe7819399d4cd264c87de71f23b2bc9338c55e5ae0c8966c2aa7b1ff9202323
      - name: apscheduler
        version: 3.11.3
        kind: wheel
        prefix: /usr/lib/python3.12/site-packages
        files:
          any:
            url: https://files.pythonhosted.org/packages/42/c9/8638db32514dbb9157b3d82680c6faea89283523edf9ed2415ea3884f2ae/apscheduler-3.11.3-py3-none-any.whl
            sha256: bbeb2ec02d23d3c06a6c07ed7f0f3939ada6680eb121fae809a69bb42c537a30
      - name: dateparser
        version: 1.4.3
        kind: wheel
        prefix: /usr/lib/python3.12/site-packages
        files:
          any:
            url: https://files.pythonhosted.org/packages/30/5f/63f927b5ffd1cc2c030fc2bd362bf920890e8806cf42f701198de5b3f9c7/dateparser-1.4.3-py3-none-any.whl
            sha256: cbce86c64e0cea5c54c84c015d34c903d46c51bfad50632bf2f05a6141d10c05

  sabnzbd-base:
    # Base for the shell-free SABnzbd build (neilcar/sabnzbd-image): Python 3.14 (SABnzbd runs on
    # 3.14 today), 7-Zip (`7zz`), and the shared libraries of the unrar and par2cmdline-turbo
    # binaries that image builds from source (libstdc++, libgcc; par2's OpenMP: libgomp).
    # Versioned by python-3.14. Runs as uid/gid 1000 (`sabnzbd`, home /config), like the chart's pod.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: sabnzbd, gid: 1000}]
      users: [{username: sabnzbd, uid: 1000, gid: 1000, homedir: /config}]
    variants:
      runtime:
        packages: ["{package}", "7zip", "libstdc++", "libgcc", "libgomp"]
      # dev: compilers for unrar and par2cmdline-turbo, pip and uv for SABnzbd's hash-locked
      # requirements (its C extensions come as manylinux wheels), xz for par2's .tar.xz.
      dev:
        packages: ["{package}", "7zip", "libstdc++", "libgcc", "libgomp", "busybox", "bash", "gcc", "make", "glibc-dev", "py3.14-pip", "uv", "xz"]
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /config, type: directory, permissions: 0755, uid: 1000, gid: 1000}
      # CPython ships encodings/rot_13.py executable with `#!/usr/bin/env python3`; it is only
      # ever imported, and the runtime has no env, so drop its execute bit (shebang audit).
      - {path: /usr/lib/python3.14/encodings/rot_13.py, type: permissions, permissions: 0644}

  servarr-base:
    # Base for the shell-free Servarr apps (neilcar/servarr-image): Prowlarr, Radarr, Sonarr, Whisparr and
    # Lidarr, whose official linux tarballs are self-contained .NET builds. Only the system libraries they
    # load: ICU (globalization), OpenSSL (TLS), zlib, SQLite, libstdc++/libgcc, plus the CA bundle and
    # tzdata. Lidarr fingerprints new files with fpcalc: chromaprint's static release build (vendor below;
    # Wolfi has no chromaprint). Versioned by libicu79. Runs as uid/gid 1000 (`servarr`, home /config),
    # like the chart's pods. Runtime only: servarr-image downloads the tarballs in its own build stage.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: servarr, gid: 1000}]
      users: [{username: servarr, uid: 1000, gid: 1000, homedir: /config}]
    variants:
      runtime:
        packages: ["{package}", "libssl3", "libcrypto3", "zlib", "sqlite-libs", "libstdc++", "libgcc", "ca-certificates-bundle", "tzdata"]
    environment:
      # .NET uses the system ICU (never invariant mode: the apps sort and compare titles by culture).
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      XDG_CONFIG_HOME: /config
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /config, type: directory, permissions: 0755, uid: 1000, gid: 1000}
      - {path: /run, type: directory, permissions: 0755, uid: 1000, gid: 1000}
    # Not a Wolfi package: chromaprint's statically linked fpcalc 1.6.2, pinned by sha256.
    vendor:
      - name: fpcalc
        version: 1.6.2
        kind: tar-binary
        prefix: /usr/bin
        files:
          x86_64:
            url: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-linux-x86_64.tar.gz
            sha256: c968ad4a0821592a79b158fb2e1f46cbe0a22a0a1dbc0743c67d68e75d15d2bb
            member: chromaprint-fpcalc-1.6.2-linux-x86_64/fpcalc
          aarch64:
            url: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-linux-arm64.tar.gz
            sha256: 3aa1498126ed272d805bc9d081c77965c9e1e1a0891bb112c13b56ef2ad47bad
            member: chromaprint-fpcalc-1.6.2-linux-arm64/fpcalc

  beets-base:
    # Base for the shell-free beets build (neilcar/pyapps-image): Python 3.12 (beets 2.14.1 runs on it),
    # tini as PID 1 (reaps the auto-import workers that `kubectl exec` leaves behind), Wolfi ffmpeg
    # (the convert plugin and split_cue.py's ffprobe), flac/metaflac, ImageMagick 7 (`magick`, which
    # beets' ArtResizer prefers to `convert`) and fpcalc for the chroma plugin (chromaprint's static
    # build, as servarr-base: Wolfi has no chromaprint). Versioned by python-3.12. Runs as uid/gid 1000
    # (`beets`, home /config), like the chart's pod. pyapps-image pip-installs beets and its plugins
    # (hash-pinned) in a build stage on the dev variant.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: beets, gid: 1000}]
      users: [{username: beets, uid: 1000, gid: 1000, homedir: /config}]
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      runtime:
        # distroless-no-shell: ffmpeg's libsrt needs cmd:bash only for unused scripts (as stash-base).
        packages: ["{package}", "distroless-no-shell", "tini", "ffmpeg", "flac", "imagemagick-7", "ca-certificates-bundle", "tzdata", "libstdc++", "libgcc"]
      # dev: pip and uv for the hash-locked requirements (their C extensions come as manylinux wheels).
      dev:
        packages: ["{package}", "tini", "ffmpeg", "flac", "imagemagick-7", "ca-certificates-bundle", "tzdata", "libstdc++", "libgcc", "busybox", "bash", "py3.12-pip", "uv"]
    environment:
      BEETSDIR: /config
      HOME: /config
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /config, type: directory, permissions: 0755, uid: 1000, gid: 1000}
      # CPython 3.12's stdlib cgi.py has `#! /usr/local/bin/python` (only ever imported): give the shebang
      # a target so the shebang audit holds, as stash-base does.
      - {path: /usr/local/bin, type: directory, permissions: 0755, uid: 0, gid: 0}
      - {path: /usr/local/bin/python, type: symlink, source: /usr/bin/python3.12, permissions: 0755}
    # Not a Wolfi package: chromaprint's statically linked fpcalc 1.6.2, pinned by sha256 (as servarr-base).
    vendor:
      - name: fpcalc
        version: 1.6.2
        kind: tar-binary
        prefix: /usr/bin
        files:
          x86_64:
            url: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-linux-x86_64.tar.gz
            sha256: c968ad4a0821592a79b158fb2e1f46cbe0a22a0a1dbc0743c67d68e75d15d2bb
            member: chromaprint-fpcalc-1.6.2-linux-x86_64/fpcalc
          aarch64:
            url: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-linux-arm64.tar.gz
            sha256: 3aa1498126ed272d805bc9d081c77965c9e1e1a0891bb112c13b56ef2ad47bad
            member: chromaprint-fpcalc-1.6.2-linux-arm64/fpcalc

  flaresolverr-base:
    # Base for the shell-free FlareSolverr build (neilcar/pyapps-image): Python 3.11 (what the stock
    # image runs FlareSolverr v3.5.2 on), Wolfi Chromium with its chromedriver, dumb-init as PID 1 (reaps
    # Chromium's children, as the stock image does) and DejaVu fonts (the stock image's only fonts). No
    # Xvfb: FlareSolverr runs Chromium with --headless=new (the stock image's Xvfb display goes unused),
    # and Xvfb compiles its keymap through /bin/sh. Wolfi's /usr/bin/chromium is a shell launcher:
    # callers start /usr/lib/chromium/chrome directly. Versioned by chromium. Runs as uid/gid 1000
    # (`flaresolverr`, home /config), like the chart's pod.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: flaresolverr, gid: 1000}]
      users: [{username: flaresolverr, uid: 1000, gid: 1000, homedir: /config}]
    # The launcher as /usr/bin/env in the runtime (CPython's, mesa's and systemd's `#!/usr/bin/env python3`
    # scripts; nothing to vendor).
    env_launcher: true
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      runtime:
        packages: ["{package}", "distroless-no-shell", "python-3.11", "dumb-init", "ttf-dejavu", "ca-certificates-bundle", "tzdata"]
      # dev: pip and uv for pyapps-image's hash-locked requirements.
      dev:
        packages: ["{package}", "python-3.11", "dumb-init", "ttf-dejavu", "ca-certificates-bundle", "tzdata", "busybox", "bash", "py3.11-pip", "uv"]
    environment:
      HOME: /config
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /config, type: directory, permissions: 0755, uid: 1000, gid: 1000}
      # CPython's stdlib cgi.py has `#! /usr/local/bin/python` (only ever imported): give the shebang a
      # target so the shebang audit holds, as beets-base does.
      - {path: /usr/local/bin, type: directory, permissions: 0755, uid: 0, gid: 0}
      - {path: /usr/local/bin/python, type: symlink, source: /usr/bin/python3.11, permissions: 0755}

  jdownloader-base:
    # Base for the shell-free headless JDownloader build (neilcar/jdownloader-image): OpenJDK 21's JRE
    # (java on PATH as /usr/bin/java), tini as PID 1 (reaps the ffmpeg children JDownloader starts),
    # Wolfi ffmpeg/ffprobe (stream merging) and libstdc++/libgcc (the 7-Zip-JBinding native library
    # JDownloader ships in its libs/). Versioned by openjdk-21-jre. Runs as uid/gid 1000 (`jdownloader`,
    # home /config), like the pod (the volume is 1000:1000).
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: jdownloader, gid: 1000}]
      users: [{username: jdownloader, uid: 1000, gid: 1000, homedir: /config}]
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      runtime:
        # distroless-no-shell: ffmpeg's libsrt needs cmd:bash only for unused scripts (as stash-base).
        packages: ["{package}", "distroless-no-shell", "tini", "ffmpeg", "libstdc++", "libgcc", "ca-certificates-bundle", "tzdata"]
      # dev: busybox, bash and curl for jdownloader-image's snapshot stage (runs JDownloader's updater).
      dev:
        packages: ["{package}", "tini", "ffmpeg", "libstdc++", "libgcc", "ca-certificates-bundle", "tzdata", "busybox", "bash", "curl"]
    environment:
      HOME: /config
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /config, type: directory, permissions: 0755, uid: 1000, gid: 1000}
      - {path: /usr/bin/java, type: symlink, source: /usr/lib/jvm/java-21-openjdk/bin/java, permissions: 0755}

  debug:
    # Break-glass toolbox for troubleshooting shell-free containers: attached to a pod with
    # `kubectl debug --target=<container>` (or as a temporary sidecar), only with the owner's OK
    # each time. It shares the target's process and network namespaces and reaches its files
    # through /proc/<pid>/root, so it runs as root. Unlike every other image it has a shell, so
    # its only variant is `tools`, not `runtime` (the no-shell checks apply to runtime variants).
    # Versioned by bash.
    run_as: "0"
    lines: [latest]
    variants:
      tools:
        packages: ["{package}", "coreutils", "findutils", "grep", "sed", "gawk", "procps", "less", "file", "gnutar", "gzip", "util-linux-misc", "nsenter", "curl", "openssl", "jq", "yq", "sqlite", "bind-tools", "netcat-openbsd", "iproute2", "tcpdump", "strace", "lsof"]
        entrypoint: "/bin/bash"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}

  tesseract:
    # Tesseract OCR with English data and Python 3.12, for the Stash Text Reader's OCR service
    # (lxdk8s fleet/stash-ocr mounts its small stdlib HTTP server as a ConfigMap). Runtime only.
    # Also the fast English model (tessdata_fast) in /usr/share/tessdata-fast: on video
    # watermarks it read 18 of 25 test scenes against 14 for Wolfi's standard model.
    # OMP_THREAD_LIMIT=1: one thread per page; the service runs pages in parallel instead.
    lines: [latest]
    variants:
      runtime:
        packages: ["{package}", "tesseract-eng", "python-3.12"]
        entrypoint: "/usr/bin/python3.12"
    environment:
      PYTHONUNBUFFERED: "1"
      OMP_THREAD_LIMIT: "1"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
    # Not a Wolfi package: the 4.1.0 tessdata_fast English model, pinned by sha256. Use it with
    # `tesseract --tessdata-dir /usr/share/tessdata-fast` (that directory holds no configs, so
    # ask for TSV with `-c tessedit_create_tsv=1` rather than the `tsv` config name).
    vendor:
      - name: eng.traineddata
        version: 4.1.0
        kind: binary
        prefix: /usr/share/tessdata-fast
        files:
          x86_64:
            url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
            sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
          aarch64:
            url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
            sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  python-ssh:
    # Python 3.12 and the OpenSSH client, for small stdlib scripts that shell out to `ssh`
    # (lxdk8s feral-janitor: tidies the Feral seedbox over SSH). Versioned by python-3.12.
    # Runs as uid/gid 1000 (`janitor`, home /tmp): ssh looks the running uid up in
    # /etc/passwd and needs no config file. openssh-client pulls no shell, so the runtime
    # needs no distroless-no-shell.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: janitor, gid: 1000}]
      users: [{username: janitor, uid: 1000, gid: 1000, homedir: /tmp}]
    variants:
      runtime:
        packages: ["{package}", "openssh-client"]
        entrypoint: "/usr/bin/python3.12"
      dev:
        packages: ["{package}", "openssh-client", "busybox"]
        entrypoint: "/usr/bin/python3.12"
    environment:
      PYTHONUNBUFFERED: "1"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}

  ci-tools:
    # busybox and curl for CI smoke tests (hey-furby's image.yml), in place of Docker Hub's
    # busybox and curlimages/curl, which hit the anonymous pull rate limit. The entrypoint is
    # curl, as in curlimages/curl; run busybox applets with `--entrypoint chown` and the like
    # (`-u 0` where they need root). It has a shell, so, like debug, its only variant is
    # `tools`. Versioned by curl. Runs as 65532.
    lines: [latest]
    variants:
      tools:
        packages: ["{package}", "busybox"]
        entrypoint: "/usr/bin/curl"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}

  valkey:
    # Valkey, the Redis-compatible server (Wolfi has no Redis since its license change), for
    # photoprism-k8s's CI Redis service in place of Docker Hub's redis. Versioned by valkey-9.0.
    # Runs as uid/gid 999 (`valkey`, home /data), like lxdk8s photoprism-index-redis's pod.
    # The default arguments match the official redis image with no config: protected mode off
    # (CI connects through a published port, and GitHub service containers take no command) and
    # data in /data. Pass your own arguments (a config file, a password) to replace them.
    run_as: "999"
    lines: [latest]
    accounts:
      groups: [{groupname: valkey, gid: 999}]
      users: [{username: valkey, uid: 999, gid: 999, homedir: /data}]
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    variants:
      runtime:
        # distroless-no-libc-utils stands in for posix-libc-utils (valkey depends on it; its
        # ldd is a bash script valkey never runs, and it needs bash by name).
        packages: ["{package}", "{package}-cli", "distroless-no-libc-utils"]
        entrypoint: "/usr/bin/valkey-server"
        cmd: "--protected-mode no --dir /data"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /data, type: directory, permissions: 0755, uid: 999, gid: 999}

  postgres:
    # PostgreSQL 17 for lxdk8s's n8n, atuin and postiz databases in place of Docker Hub's
    # postgres:17-alpine. Versioned by postgresql-17. No entrypoint script (the official image's
    # docker-entrypoint.sh is shell): it runs `postgres` on an existing cluster in $PGDATA; create a new
    # one with initdb. postgresql-17-client brings psql, pg_isready and pg_dump. glibc-locale-en provides
    # en_US.UTF-8, the locale the alpine image initialized the existing clusters with; glibc collates it
    # differently from musl, so text indexes need a REINDEX after a cluster moves here. Runs as uid/gid 70
    # (`postgres`, home /var/lib/postgresql), like the pods (the volumes are 70:70).
    run_as: "70"
    lines: [latest]
    accounts:
      groups: [{groupname: postgres, gid: 70}]
      users: [{username: postgres, uid: 70, gid: 70, homedir: /var/lib/postgresql}]
    variants:
      runtime:
        packages: ["{package}", "{package}-client", "glibc-locale-en", "tzdata"]
        entrypoint: "/usr/bin/postgres"
    environment:
      LANG: en_US.UTF-8
      PGDATA: /var/lib/postgresql/data/pgdata
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /var/lib/postgresql, type: directory, permissions: 0755, uid: 70, gid: 70}
      - {path: /var/lib/postgresql/data, type: directory, permissions: 0700, uid: 70, gid: 70}
      - {path: /var/run/postgresql, type: directory, permissions: 02775, uid: 70, gid: 70}

  rust:
    # The Rust toolchain (cargo, rustc, clippy, rustfmt) with gcc for crates that build C
    # (ring), for ollama-orchestrator's CI job container and Dockerfile build stage in place of
    # Docker Hub's rust:alpine. Wolfi's Rust targets glibc, so binaries built here run on `cc`.
    # Versioned by the newest rust-1.NN. Build-only: its only variant is `dev` (busybox shell,
    # the entrypoint). Runs as root, since GitHub job containers write the runner's workspace.
    # clang-23 + lld-23 (with llvm-ar) cross-compile arm64 on amd64 runners: Wolfi gcc only
    # targets its own arch; the target glibc and Rust std come from the arm64 image as a sysroot.
    run_as: "0"
    lines: [latest]
    variants:
      dev:
        packages: ["{package}", "busybox", "gcc", "glibc-dev", "clang-23", "lld-23", "git"]
        entrypoint: "/bin/sh"
    environment:
      CARGO_HOME: /usr/local/cargo
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
      - {path: /usr/local/cargo, type: directory, permissions: 0755, uid: 0, gid: 0}

  cc:
    # glibc and libgcc, for dynamically linked Rust and C binaries (ollama-orchestrator, built
    # on `rust`). `static` plus the C runtime, as Google's distroless/cc. Versioned by libgcc,
    # whose libc.so.6 dependency brings in Wolfi's current glibc (glibc-2.44; the unversioned
    # `glibc` package stopped at 2.43).
    lines: [latest]
    variants:
      runtime:
        packages: ["{package}"]

  nodejs:
    # Node.js runtime for homelab-mcp's `discogs` image (the npm discogs-mcp-server behind its
    # bearer gate), in place of Docker Hub's node:alpine. One line per Node LTS major Wolfi ships,
    # today 26 (`nodejs-26`); the pin follows that package. Runtime only (no npm, no shell): the
    # Dockerfile installs node_modules in a build stage and copies them in. Runs as 65532 unless
    # the Dockerfile says otherwise.
    lines: ["26"]
    variants:
      runtime:
        packages: ["{package}"]
        entrypoint: "/usr/bin/node"
    environment:
      NODE_ENV: production
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}

  music-videos-base:
    # Base for the nightly music-video fetcher Job (neilcar/music-videos): Python 3.12 for its stdlib-only
    # code, yt-dlp (vendored as photoprism-base does; run with `--js-runtimes node`, so Node.js 26 is
    # installed), and Wolfi ffmpeg/ffprobe (libx264 + AAC encoding). Versioned by python-3.12.
    # Runs as uid/gid 1000 (`mv`, home /tmp) with a read-only root; /tmp is the only writable path.
    run_as: "1000"
    lines: [latest]
    accounts:
      groups: [{groupname: mv, gid: 1000}]
      users: [{username: mv, uid: 1000, gid: 1000, homedir: /tmp}]
    variants:
      runtime:
        # distroless-no-shell: ffmpeg's libsrt needs cmd:bash only for unused scripts (as stash-base).
        packages: ["{package}", "distroless-no-shell", "ffmpeg", "nodejs-26", "ca-certificates-bundle", "tzdata"]
        entrypoint: "/usr/bin/python3.12"
      dev:
        packages: ["{package}", "ffmpeg", "nodejs-26", "ca-certificates-bundle", "tzdata", "busybox"]
        entrypoint: "/usr/bin/python3.12"
    extra_repositories: ["./packages"]
    extra_keyring: ["./melange.rsa.pub"]
    environment:
      PYTHONUNBUFFERED: "1"
    paths:
      - {path: /tmp, type: directory, permissions: 01777, uid: 0, gid: 0}
    # Not a Wolfi package: the yt-dlp release binary, the same version and sha256 as photoprism-base.
    vendor:
      - name: yt-dlp
        version: 2026.10.21
        kind: binary
        prefix: /opt/yt-dlp
        files:
          x86_64:
            url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux
            sha256: d8bd33fca9d5b23bd5b9952b3fca36db5c46331933fda9f598a3da14ce2c243f
          aarch64:
            url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux_aarch64
            sha256: e137c2171b0b8ef648e6136e86aa70c65923e93e434f01c93901d64744b190aa
        launchers: [yt-dlp]
